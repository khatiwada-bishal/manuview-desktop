<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManuView Desktop</title>
    <script>
      // Every time the application is opened, default loading is in dark mode
      try {
        const sessionTheme = sessionStorage.getItem('manuview_theme_mode');
        if (sessionTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body class="bg-[#080B11] text-[#F8FAFC] antialiased overflow-hidden select-none">
    <!-- App Startup Liquid Glass Splash Screen (Full Screen SVG Cover) -->
    <div id="app-splash" style="position: fixed; inset: 0; z-index: 99999; width: 100vw; height: 100vh; background-color: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);">
      <img src="/loading.svg" alt="Loading ManuView..." style="width: 100vw; height: 100vh; object-fit: cover; display: block;" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
