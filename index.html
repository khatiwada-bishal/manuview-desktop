<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManuView Desktop</title>
    <script>
      // Every time the application is opened, default loading is in dark mode
      try {
        const sessionTheme = sessionStorage.getItem('manuview_theme_mode');
        if (sessionTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body class="bg-[#080B11] text-[#F8FAFC] antialiased overflow-hidden select-none">
    <!-- App Startup Liquid Glass Splash Screen -->
    <div id="app-splash" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07090E; transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);">
      <div style="position: relative; width: 280px; max-width: 85vw; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="position: absolute; inset: 0; border-radius: 9999px; background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, rgba(147,51,234,0.12) 45%, transparent 70%); filter: blur(28px); pointer-events: none;"></div>
        <img src="/loading.svg" alt="Loading ManuView..." style="width: 100%; height: auto; display: block; position: relative; z-index: 10; filter: drop-shadow(0 10px 30px rgba(59,130,246,0.3));" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
