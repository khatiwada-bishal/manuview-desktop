name: Release Multi-Platform Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "universal-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7b7669bd7082661048e9196b02fe4965851f5038 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri Installers
        uses: tauri-apps/tauri-action@850e0f3e09d17d52a26fa2a1491cf0eb2620c326 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Code Signing & Notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri Auto-Updater Signing Keys
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag || 'v0.1.0' }}
          releaseName: "ManuView Desktop ${{ github.ref_name || inputs.release_tag || 'v0.1.0' }}"
          releaseBody: "Automated multi-platform desktop release for macOS (Universal: Apple Silicon & Intel) and Windows (x64 Installer)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate SHA-256 Checksums (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p checksums
          find src-tauri/target/universal-apple-darwin/release/bundle -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.app" \) -exec shasum -a 256 {} + > checksums/checksums-macos.txt || true
          cat checksums/checksums-macos.txt || true

      - name: Generate SHA-256 Checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Include *.msi,*.exe,*.zip | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -Append -FilePath "checksums\checksums-windows.txt"
          }
          Get-Content "checksums\checksums-windows.txt" -ErrorAction SilentlyContinue
